    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #1c1c1c;
        --surface: #242424;
        --sidebar-bg: #1e1e1e;
        --card: #2a2a2a;
        --card-hover: #313131;
        --border: rgba(255, 255, 255, 0.07);
        --border-h: rgba(255, 255, 255, 0.13);
        --accent: #5b9bd5;
        --accent-gold: #f5c842;
        --accent-cyan: #00bcd4;
        --featured: #5b9bd5;
        --emotes: #f5c842;
        --cosmetics: #f5a623;
        --collections: #a78bfa;
        --legacy: #e07b54;
        --bundles: #34d399;
        --tags: #e879f9;
        --text: #e8e8e8;
        --text-2: #a0a0a0;
        --text-3: #606060;
        --legendary: #f5c842;
        --epic: #c160f0;
        --rare: #4d9ef5;
        --uncommon: #3ecf7a;
        --common: #8899bb;
        --sidebar-w: 190px;
        --header-h: 48px;
        --top-bar-h: 52px;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        font-size: 14px;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      /* ── TOP BAR ── */
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        height: var(--top-bar-h);
        background: #1a1a1a;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 0;
      }

      .tb-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-2);
        padding: 0 12px;
        letter-spacing: 0.01em;
      }

      .tb-section-name {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        flex: 1;
        padding-left: 16px;
      }

      .tb-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tb-filter-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        font-family: "Nunito", sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .tb-filter-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .redeem-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        font-family: "Nunito", sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .redeem-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .coins-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #3a6fa8;
        border: none;
        color: #fff;
        font-family: "Nunito", sans-serif;
        font-size: 0.8rem;
        font-weight: 800;
        padding: 6px 14px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .coins-btn:hover {
        background: #4a80bb;
      }
      .coins-icon {
        font-size: 0.9rem;
      }

      .tb-search-wrap {
        position: relative;
      }
      .tb-search-wrap svg {
        position: absolute;
        left: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        pointer-events: none;
      }
      .tb-search {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.09);
        color: var(--text);
        font-family: "Nunito", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 6px 10px 6px 30px;
        border-radius: 4px;
        outline: none;
        width: 160px;
        transition: border-color 0.15s;
      }
      .tb-search:focus {
        border-color: rgba(91, 155, 213, 0.5);
      }
      .tb-search::placeholder {
        color: var(--text-3);
      }

      /* ── SORT DROPDOWN ── */
      .sort-wrap {
        position: relative;
      }
      .sort-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-2);
        font-family: "Nunito", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
        white-space: nowrap;
      }
      .sort-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }
      .sort-btn svg {
        opacity: 0.5;
      }
      .sort-dropdown {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        background: #2a2a2a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        min-width: 150px;
        z-index: 300;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .sort-wrap.open .sort-dropdown {
        display: block;
      }
      .sort-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-family: "Nunito", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-2);
        background: none;
        border: none;
        width: 100%;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.1s,
          color 0.1s;
      }
      .sort-option:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      .sort-option.active {
        color: var(--accent);
      }
      .sort-option .sort-check {
        opacity: 0;
        width: 10px;
        flex-shrink: 0;
      }
      .sort-option.active .sort-check {
        opacity: 1;
      }
      .layout {
        display: flex;
        padding-top: var(--top-bar-h);
        min-height: 100vh;
      }

      /* ── SIDEBAR ── */
      .sidebar {
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
        position: fixed;
        top: var(--top-bar-h);
        left: 0;
        bottom: 0;
        overflow-y: auto;
        overflow-x: hidden;
        background: var(--sidebar-bg);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        padding: 8px 0;
      }

      /* Top-level nav item */
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 9px 14px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-2);
        font-family: "Nunito", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        text-align: left;
        transition:
          background 0.12s,
          color 0.12s;
        position: relative;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }
      .nav-item.active {
        color: var(--text);
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 2px;
        bottom: 2px;
        width: 3px;
        border-radius: 0 3px 3px 0;
      }
      .nav-featured.active::before {
        background: var(--featured);
      }
      .nav-emotes.active::before {
        background: var(--emotes);
      }
      .nav-cosmetics.active::before {
        background: var(--cosmetics);
      }
      .nav-collections.active::before {
        background: var(--collections);
      }
      .nav-legacy.active::before {
        background: var(--legacy);
      }
      .nav-bundles.active::before {
        background: var(--bundles);
      }
      .nav-tags.active::before {
        background: var(--tags);
      }

      .nav-icon {
        font-size: 0.85rem;
        flex-shrink: 0;
      }
      .nav-featured .nav-icon {
        color: var(--featured);
      }
      .nav-emotes .nav-icon {
        color: var(--emotes);
      }
      .nav-cosmetics .nav-icon {
        color: var(--cosmetics);
      }
      .nav-collections .nav-icon {
        color: var(--collections);
      }
      .nav-legacy .nav-icon {
        color: var(--legacy);
      }
      .nav-bundles .nav-icon {
        color: var(--bundles);
      }
      .nav-tags .nav-icon {
        color: var(--tags);
      }

      .nav-chevron {
        margin-left: auto;
        color: var(--text-3);
        transition: transform 0.18s;
        display: flex;
        align-items: center;
      }
      .nav-item.open .nav-chevron {
        transform: rotate(90deg);
      }

      /* Sub-category list */
      .sub-list {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.22s ease;
      }
      .sub-list.open {
        max-height: 600px;
      }

      .sub-btn {
        width: 100%;
        display: flex;
        align-items: center;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-3);
        font-family: "Nunito", sans-serif;
        font-size: 0.77rem;
        font-weight: 600;
        text-align: left;
        padding: 6px 14px 6px 34px;
        transition:
          color 0.12s,
          background 0.12s;
      }
      .sub-btn:hover {
        color: var(--text-2);
        background: rgba(255, 255, 255, 0.03);
      }
      .sub-btn.active {
        color: var(--text);
      }

      /* ── MAIN ── */
      .main {
        margin-left: var(--sidebar-w);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* Section header above grid (category banner) */
      .section-header {
        padding: 18px 22px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .section-title {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-2);
        text-transform: none;
        letter-spacing: 0;
      }

      /* GRID */
      .content {
        padding: 16px 22px;
        flex: 1;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }

      /* Grouped sections */
      .section-group {
        margin-bottom: 24px;
      }
      .group-label {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-3);
        text-align: center;
        letter-spacing: 0.08em;
        padding-bottom: 10px;
        position: relative;
      }
      .group-label::before,
      .group-label::after {
        content: "";
        position: absolute;
        top: 50%;
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
        width: calc(50% - 60px);
      }
      .group-label::before {
        left: 0;
      }
      .group-label::after {
        right: 0;
      }

      /* CARD — matches in-game square cards */
      .card {
        background: var(--card);
        border: 2px solid transparent;
        /* border-radius: 6px; */
        overflow: hidden;
        cursor: pointer;
        animation: pop 0.2s ease both;
        position: relative;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .card:hover {
        background: var(--card-hover);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .card:hover .card-img {
        background: #2e2e2e !important;
      }
      .card.owned {
        /* slight glow */
      }

      .card-img {
        aspect-ratio: 1 / 1;
        background: #2e2e2e;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      /* Card image background tinted by rarity */
      .card.tier-LEGENDARY .card-img {
        background: linear-gradient(160deg, #1e1500 0%, #2a1e05 100%);
      }
      .card.tier-EPIC .card-img {
        background: linear-gradient(160deg, #160d1e 0%, #1f1028 100%);
      }
      .card.tier-RARE .card-img {
        background: linear-gradient(160deg, #071525 0%, #0d1e35 100%);
      }
      .card.tier-UNCOMMON .card-img {
        background: linear-gradient(160deg, #071510 0%, #0d1e16 100%);
      }
      .card.tier-COMMON .card-img {
        background: linear-gradient(160deg, #111111 0%, #1a1a1a 100%);
      }

      .card-img img {
        max-height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .fallback-icon {
        font-size: 0.8rem;
        color: var(--text-3);
        opacity: 0.3;
      }

      /* Variant swatches — top-right corner of card image */
      .variant-swatches {
        position: absolute;
        top: 5px;
        right: 5px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .variant-swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        flex-shrink: 0;
      }
      .variant-swatch:hover {
        border-color: rgba(255, 255, 255, 0.7);
      }
      .variant-swatch.active {
        border-color: #fff;
      }

      /* New badge */
      .new-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #4caf50;
        color: #fff;
        font-size: 0.55rem;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Free badge */
      .free-badge {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(245, 200, 66, 0.15);
        color: var(--accent-gold);
        font-size: 0.6rem;
        font-weight: 800;
        text-align: center;
        padding: 2px 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* Unlock action badges — top-left corner of the whole card */
      .unlock-badge-wrap {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
      }
      .unlock-badge {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* border-radius: 0 0 4px 0; */
        cursor: default;
      }
      .unlock-badge-server {
        background: #1a6fc4;
      }
      .unlock-badge-sps {
        background: #c86a00;
      }
      .unlock-badge svg {
        flex-shrink: 0;
        display: block;
      }

      /* Tooltip shown on badge hover */
      .unlock-badge-wrap .unlock-tooltip {
        display: none;
        position: absolute;
        top: 24px;
        left: 0;
        background: #0e0e0e;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #e8e8e8;
        font-size: 0.63rem;
        font-weight: 600;
        padding: 5px 8px;
        border-radius: 4px;
        width: max-content;
        max-width: 175px;
        white-space: normal;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
        pointer-events: none;
        line-height: 1.45;
        z-index: 100;
      }
      .unlock-badge-wrap:hover .unlock-tooltip {
        display: block;
      }

      .tier-badge-corner {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .tier-LEGENDARY .tier-badge-corner {
        background: var(--legendary);
        box-shadow: 0 0 6px rgba(245, 200, 66, 0.6);
      }
      .tier-EPIC .tier-badge-corner {
        background: var(--epic);
        box-shadow: 0 0 6px rgba(193, 96, 240, 0.6);
      }
      .tier-RARE .tier-badge-corner {
        background: var(--rare);
        box-shadow: 0 0 6px rgba(77, 158, 245, 0.6);
      }
      .tier-UNCOMMON .tier-badge-corner {
        background: var(--uncommon);
      }
      .tier-COMMON .tier-badge-corner {
        background: var(--common);
      }

      .card-info {
        padding: 6px 8px 7px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .card-name {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .card-owned-check {
        flex-shrink: 0;
        font-size: 0.7rem;
        line-height: 1;
        margin-left: auto;
      }
      .card-owned-check.check-green {
        color: #4caf50;
      }
      .card-owned-check.check-yellow {
        color: #c8b400;
      }
      .card-owned-check.check-blue {
        font-size: 0.75rem;
      }

      /* ── BUNDLE PANELS ───────────────────────────────────────────────── */

      .grid.bundles-layout {
        grid-template-columns: 1fr 1fr !important;
        gap: 16px;
      }

      .bundle-panel {
        background: var(--card);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        animation: pop 0.22s ease both;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      /* Centered title bar */
      .bundle-panel-title-bar {
        padding: 8px 14px;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-2);
        text-align: center;
        letter-spacing: 0.01em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* Body row */
      .bundle-panel-body {
        display: flex;
        align-items: stretch;
      }

      /* ── LEFT: 3-D viewer / preview ── */
      .bundle-preview {
        flex-shrink: 0;
        width: 160px;
        min-height: 0;
        flex-shrink: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }
      .bundle-viewer-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        height: 160px;
        min-height: 160px;
        background: #0e0e0e;
      }

      .bundle-viewer-placeholder {
        width: 100%;
        height: 100%;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-3);
        font-size: 0.7rem;
        font-weight: 600;
        flex-direction: column;
        gap: 8px;
        opacity: 0.45;
      }
      .bundle-viewer-placeholder svg {
        opacity: 0.5;
      }
      .bundle-viewer-wrap img {
        /* max-width: 100%; */
        max-height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        display: block;
      }

      /* FREE + name footer */
      .bundle-preview-footer {
        padding: 6px 10px 7px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(0, 0, 0, 0.35);
      }
      .bundle-preview-name {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── RIGHT: cosmetic 2-col grid ── */
      .bundle-cosmetics-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-left: none;
        align-content: start;
      }
      .bundle-cosm-cell {
        background: var(--card);
        display: flex;
        flex-direction: column;
        position: relative;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .bundle-cosm-cell:nth-child(2n) {
        border-right: none;
      }
      .bundle-cosm-cell:hover {
        background: var(--card-hover);
      }

      .bundle-cosm-img {
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        background: #222;
      }

      .bundle-cosm-img img {
        /* max-width: 100%; */
        max-height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        display: block;
      }
      .bundle-cosm-fallback {
        font-size: 0.72rem;
        color: var(--text-3);
        opacity: 0.35;
      }
      /* NEW badge */
      .bundle-cosm-new {
        position: absolute;
        top: 5px;
        left: 5px;
        background: #4caf50;
        color: #fff;
        font-size: 0.52rem;
        font-weight: 800;
        padding: 2px 6px;
        border-radius: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .bundle-cosm-info {
        padding: 4px 8px 5px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
      .bundle-cosm-name {
        font-size: 0.67rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* BUNDLE MODAL */
      .bundle-cosmetic-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 4px;
      }
      .bundle-cosmetic-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 4px;
        padding: 6px 10px;
      }
      .bundle-cosmetic-slot {
        font-size: 0.62rem;
        font-weight: 700;
        color: var(--text-3);
        min-width: 72px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .bundle-cosmetic-id {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--text-2);
      }

      /* EMPTY */
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 80px 20px;
        color: var(--text-3);
      }
      .empty p {
        font-size: 0.82rem;
        font-weight: 600;
      }

      /* LOADER */
      #loaderArea {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 100px 20px;
        gap: 10px;
        color: var(--text-3);
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(91, 155, 213, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loaderArea p {
        font-size: 0.78rem;
        font-weight: 600;
      }

      /* RESULTS */
      .results-bar {
        font-size: 0.72rem;
        color: var(--text-3);
        margin-bottom: 14px;
        font-weight: 600;
      }
      .results-bar em {
        color: var(--text-2);
        font-style: normal;
      }

      /* MODAL */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }
      .overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      .modal {
        background: #242424;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        width: 100%;
        max-width: 640px;
        max-height: 88vh;
        overflow-y: auto;
        transform: scale(0.97) translateY(10px);
        transition: transform 0.2s;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
      }
      .overlay.open .modal {
        transform: scale(1) translateY(0);
      }

      /* ── WIKI UNLOCK BANNER ── */
      .wiki-unlock-banner {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        background: rgba(91, 155, 213, 0.08);
        border: 1px solid rgba(91, 155, 213, 0.22);
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--accent);
        line-height: 1.5;
        margin-bottom: 10px;
      }
      .wiki-unlock-banner strong {
        font-weight: 800;
      }

      /* ── WIKI THUMBNAIL ── */
      .wiki-thumbnail-wrap {
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 4px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        background: #111;
      }
      .wiki-thumbnail {
        width: 100%;
        display: block;
        object-fit: cover;
        image-rendering: auto;
      }

      /* ── WIKI IMAGE GALLERY ── */
      .wiki-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
        margin-bottom: 4px;
      }
      .wiki-gallery-item {
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.07);
        background: #111;
        cursor: pointer;
      }
      .wiki-gallery-item:hover .wiki-gallery-img {
        filter: brightness(1.1);
      }
      .wiki-gallery-img {
        width: 100%;
        display: block;
        object-fit: cover;
        image-rendering: auto;
        transition: filter 0.15s;
      }
      .wiki-gallery-label {
        font-size: 0.62rem;
        font-weight: 700;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 4px 8px 5px;
        background: rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      /* ── MODAL WIKI DESCRIPTION ── */
      .wiki-desc {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 6px;
        padding: 11px 14px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-2);
        line-height: 1.6;
        margin-bottom: 4px;
        font-style: italic;
      }

      /* ── PRICE CHIP ── */
      .price-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(91, 155, 213, 0.1);
        border: 1px solid rgba(91, 155, 213, 0.22);
        border-radius: 5px;
        padding: 7px 12px;
      }
      .price-chip.free {
        background: rgba(62, 207, 122, 0.08);
        border-color: rgba(62, 207, 122, 0.2);
      }
      .price-chip-icon {
        font-size: 0.85rem;
        line-height: 1;
      }
      .price-chip-val {
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--accent);
      }
      .price-chip.free .price-chip-val {
        color: var(--uncommon);
      }
      .price-chip-label {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-left: 2px;
      }

      /* ── CLICKABLE TAG PILLS ── */
      .modal-tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.67rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 3px;
        cursor: pointer;
        transition:
          filter 0.12s,
          transform 0.1s;
        border: 1px solid;
        user-select: none;
      }
      .modal-tag-pill:hover {
        filter: brightness(1.25);
        transform: translateY(-1px);
      }
      .modal-tag-pill.tag-collection {
        background: rgba(167, 139, 250, 0.12);
        border-color: rgba(167, 139, 250, 0.28);
        color: var(--collections);
      }
      .modal-tag-pill.tag-set {
        background: rgba(245, 166, 35, 0.1);
        border-color: rgba(245, 166, 35, 0.25);
        color: var(--cosmetics);
      }
      .modal-tag-pill.tag-theme {
        background: rgba(233, 121, 249, 0.1);
        border-color: rgba(233, 121, 249, 0.25);
        color: var(--tags);
      }
      .modal-tag-pill.tag-legacy {
        background: rgba(224, 123, 84, 0.1);
        border-color: rgba(224, 123, 84, 0.25);
        color: var(--legacy);
      }
      .modal-tag-pill.tag-other {
        background: rgba(91, 155, 213, 0.1);
        border-color: rgba(91, 155, 213, 0.22);
        color: var(--accent);
      }

      /* ── MODAL HERO layout with wiki sidebar ── */
      .modal-hero-wrap {
        position: relative;
      }
      .modal-hero-row {
        display: flex;
        align-items: stretch;
        min-height: 200px;
        border-radius: 10px 10px 0 0;
        overflow: hidden;
        background: linear-gradient(180deg, #1a1a2e 0%, #1e1e1e 100%);
      }
      /* image side */
      .modal-hero-img-side {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        min-width: 0;
      }
      .modal-hero-img-side img {
        max-height: 180px;
        max-width: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5));
      }

      /* ── MODAL TABS ── */
      .modal-tabs {
        display: flex;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        background: #1e1e1e;
        padding: 0 20px;
        gap: 2px;
      }
      .modal-tab {
        font-family: "Nunito", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-3);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 9px 12px 8px;
        cursor: pointer;
        transition:
          color 0.13s,
          border-color 0.13s;
        letter-spacing: 0.01em;
      }
      .modal-tab:hover {
        color: var(--text-2);
      }
      .modal-tab.active {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .modal-tab-panel {
        display: none;
      }
      .modal-tab-panel.active {
        display: block;
      }

      /* ── COMPATIBILITY TAB ── */
      .compat-section-title {
        font-size: 0.62rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-3);
        margin: 14px 0 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .compat-section-title:first-child {
        margin-top: 0;
      }
      .compat-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .compat-row:last-child {
        border-bottom: none;
      }
      .compat-id {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text);
        min-width: 180px;
        flex-shrink: 0;
        font-family: monospace;
        letter-spacing: 0.01em;
      }
      .compat-parts {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      .compat-part {
        font-size: 0.6rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .armor-region-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 4px;
        background: rgba(91, 155, 213, 0.1);
        border: 1px solid rgba(91, 155, 213, 0.22);
        color: var(--accent);
        text-transform: capitalize;
        margin: 2px;
      }

      .modal-hero {
        background: linear-gradient(180deg, #1a1a2e 0%, #1e1e1e 100%);
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-radius: 10px 10px 0 0;
        overflow: hidden;
      }
      .modal-hero img {
        max-height: 170px;
        max-width: 75%;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5));
      }
      .hero-fallback {
        font-size: 2rem;
        color: var(--text-3);
        opacity: 0.25;
      }

      .modal-tier {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 0.6rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 3px 9px;
        border-radius: 3px;
      }
      .tier-LEGENDARY {
        background: rgba(245, 200, 66, 0.18);
        color: var(--legendary);
        border: 1px solid rgba(245, 200, 66, 0.3);
      }
      .tier-EPIC {
        background: rgba(193, 96, 240, 0.18);
        color: var(--epic);
        border: 1px solid rgba(193, 96, 240, 0.3);
      }
      .tier-RARE {
        background: rgba(77, 158, 245, 0.18);
        color: var(--rare);
        border: 1px solid rgba(77, 158, 245, 0.3);
      }
      .tier-UNCOMMON {
        background: rgba(62, 207, 122, 0.18);
        color: var(--uncommon);
        border: 1px solid rgba(62, 207, 122, 0.3);
      }
      .tier-COMMON {
        background: rgba(136, 153, 187, 0.12);
        color: var(--common);
        border: 1px solid rgba(136, 153, 187, 0.2);
      }

      .modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 5px;
        color: var(--text-2);
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.12s;
      }
      .modal-close:hover {
        background: rgba(255, 255, 255, 0.14);
        color: var(--text);
      }

      .modal-content {
        padding: 18px 20px 24px;
      }
      .modal-name {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 3px;
      }
      .modal-sub {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin-bottom: 16px;
      }

      .modal-section-title {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 7px;
        margin-top: 16px;
      }
      .info-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-bottom: 4px;
      }
      .info-chip {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 12px;
      }
      .info-chip-label {
        font-size: 0.57rem;
        font-weight: 700;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 3px;
      }
      .info-chip-val {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text);
        word-break: break-all;
      }

      .asset-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 12px;
        margin-bottom: 5px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .asset-key {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--accent);
        min-width: 100px;
        flex-shrink: 0;
      }
      .asset-val {
        font-size: 0.62rem;
        color: var(--text-3);
        word-break: break-all;
        line-height: 1.5;
      }
      .asset-val a {
        color: var(--accent);
        text-decoration: none;
      }
      .asset-val a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="tb-title">Wardrobe</div>
      <div style="width: 1px; height: 22px; background: rgba(255, 255, 255, 0.07); margin: 0 6px"></div>
      <div class="tb-section-name" id="tbSectionName">Featured</div>
      <div class="tb-right">
        <div class="sort-wrap" id="sortWrap">
          <button class="sort-btn" onclick="toggleSortDropdown()">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
              <line x1="1" y1="3" x2="11" y2="3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              <line x1="1" y1="6" x2="8" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              <line x1="1" y1="9" x2="5" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span id="sortLabel">Sort: Weight</span>
          </button>
          <div class="sort-dropdown" id="sortDropdown">
            <button class="sort-option active" id="sortOptWeight" onclick="setSortMode('weight', this)">
              <span class="sort-check">✓</span> Sort Weight
            </button>
            <button class="sort-option" id="sortOptAlpha" onclick="setSortMode('alpha', this)">
              <span class="sort-check">✓</span> A – Z
            </button>
          </div>
        </div>
        <div class="tb-search-wrap">
          <svg width="11" height="11" viewBox="0 0 13 13" fill="none">
            <circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.5" />
            <line x1="8.85" y1="9" x2="12" y2="12.15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input type="text" class="tb-search" id="searchInput" placeholder="Search…" />
        </div>
      </div>
    </div>

    <div class="layout">
      <!-- SIDEBAR -->
      <nav class="sidebar" id="sidebar">
        <!-- Featured -->
        <button class="nav-item nav-featured active" id="navFeatured" onclick="selectTopNav('featured')">
          <span class="nav-icon">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <path
                d="M7 1l1.545 3.13L12 4.635l-2.5 2.435.59 3.43L7 8.77l-3.09 1.73.59-3.43L2 4.635l3.455-.505L7 1z"
                fill="currentColor"
              />
            </svg>
          </span>
          Featured
        </button>

        <!-- Emotes -->
        <button class="nav-item nav-emotes" id="navEmotes" onclick="toggleSection('emotes')">
          <span class="nav-icon">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4" />
              <path
                d="M4.5 8.5c.5.8 1.3 1.2 2.5 1.2s2-.4 2.5-1.2"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <circle cx="5" cy="6" r="0.8" fill="currentColor" />
              <circle cx="9" cy="6" r="0.8" fill="currentColor" />
            </svg>
          </span>
          Emotes
          <span class="nav-chevron">
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
              <path
                d="M2.5 2L5 4.5 2.5 7"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
        <div class="sub-list" id="subEmotes">
          <button
            class="sub-btn active"
            data-section="emotes"
            data-sub="ALL"
            onclick="selectSub('emotes', 'ALL', this)"
          >
            All Emotes
          </button>
        </div>

        <!-- Cosmetics -->
        <button class="nav-item nav-cosmetics" id="navCosmetics" onclick="toggleSection('cosmetics')">
          <span class="nav-icon">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <path
                d="M7 1.5l1.2 3.6H12l-3 2.2 1.1 3.5L7 8.6l-3.1 2.2L5 7.3 2 5.1h3.8L7 1.5z"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </span>
          Cosmetics
          <span class="nav-chevron">
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
              <path
                d="M2.5 2L5 4.5 2.5 7"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
        <div class="sub-list" id="subCosmetics">
          <button class="sub-btn" data-section="cosmetics" data-sub="ALL" onclick="selectSub('cosmetics', 'ALL', this)">
            All Cosmetics
          </button>
          <button
            class="sub-btn"
            data-section="cosmetics"
            data-sub="CAPE"
            onclick="selectSub('cosmetics', 'CAPE', this)"
          >
            Cape
          </button>
          <button
            class="sub-btn"
            data-section="cosmetics"
